name: Readiness Score Tests

on:
  push:
    branches: [ agents/improve-baseline-compare-intelligence ]
  pull_request:
    branches: [ agents/improve-baseline-compare-intelligence ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
    - name: Run unit tests
      run: |
        python -m unittest discover -v baselineintelligence/tests
